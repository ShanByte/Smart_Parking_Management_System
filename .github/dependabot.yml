version: 2
updates:
  # Maintain dependencies for npm workspaces
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'typescript*'

  # Maintain dependencies for Docker images
  - package-ecosystem: 'docker'
    directory: '/infra'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5

  # Maintain GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
