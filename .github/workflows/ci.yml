name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

  security-audit-and-scan:
    name: Security Audit & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan for committed secrets
        run: |
          echo "Scanning repository for accidentally committed secrets..."
          if git log -n 10 --diff-filter=d -p | grep -E -i "(password|secret|key|token)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"; then
            echo "ERROR: Possible secret detected in recent git commits!"
            exit 1
          fi
          if [ -f .env ]; then
            echo "ERROR: .env file must never be committed to git!"
            exit 1
          fi
          echo "Secret scan passed."

  test-and-build:
    name: Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine3.20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_postgres_password
          POSTGRES_DB: smart_parking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_parking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2.5-alpine3.20
        env:
          REDIS_PASSWORD: test_redis_password
        ports:
          - 6379:6379
        options: >-
          --entrypoint redis-server
          --health-cmd "redis-cli -a test_redis_password ping | grep PONG"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:test_postgres_password@localhost:5432/smart_parking_test?schema=public
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Run tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:test_postgres_password@localhost:5432/smart_parking_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:test_postgres_password@localhost:5432/smart_parking_test?schema=public
          REDIS_URL: redis://:test_redis_password@localhost:6379
        run: npm run test

      - name: Run build
        run: npm run build
